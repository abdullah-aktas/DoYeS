<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DÖSE Yönetim — Hesap</title>
  <style>
    :root { --ana: #1f4e79; --kenar: #d7e0ea; --metin: #1a2332; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; background: linear-gradient(145deg, #0d2c4a, var(--ana), #2f6aa3); min-height: 100vh; color: var(--metin); }
    main { max-width: 420px; margin: 0 auto; padding: 48px 16px; }
    .kart { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 12px 32px rgba(0,0,0,.2); }
    h1 { margin: 0 0 8px; font-size: 1.35rem; color: var(--ana); }
    p { margin: 0 0 16px; color: #5c6b7a; line-height: 1.45; font-size: .95rem; }
    label { display: block; font-size: .85rem; margin: 12px 0 4px; }
    input { width: 100%; padding: 12px; border: 1px solid var(--kenar); border-radius: 8px; font-size: 1rem; }
    button { margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--ana); color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .ok { color: #0d6a3f; background: #e8f6ee; padding: 10px 12px; border-radius: 8px; margin-top: 12px; }
    .hata { color: #8a1f1f; background: #fdecec; padding: 10px 12px; border-radius: 8px; margin-top: 12px; }
    .gizli { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="kart">
      <h1>DÖSE Yönetim</h1>
      <p id="aciklama">Bağlantı işleniyor…</p>
      <div id="onay" class="gizli">
        <p class="ok">E-posta doğrulandı. Masaüstü veya mobil uygulamadan giriş yapabilirsiniz.</p>
      </div>
      <form id="form" class="gizli">
        <p>Yeni şifrenizi belirleyin (en az 8 karakter). Sonra uygulamadan giriş yapın.</p>
        <label for="s1">Yeni şifre</label>
        <input id="s1" type="password" autocomplete="new-password" minlength="8" required />
        <label for="s2">Şifre tekrar</label>
        <input id="s2" type="password" autocomplete="new-password" minlength="8" required />
        <button id="kaydet" type="submit">Şifreyi kaydet</button>
      </form>
      <div id="mesaj"></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function () {
      var SUPABASE_URL = "https://bzirnfsgdswcwwutmwdi.supabase.co";
      var ANON = "sb_publishable_CSADmKJ3hXm-9jCT7BIfZg_pecVOO5Y";
      var aciklama = document.getElementById("aciklama");
      var form = document.getElementById("form");
      var onay = document.getElementById("onay");
      var mesaj = document.getElementById("mesaj");

      function hataYaz(t) {
        mesaj.innerHTML = '<div class="hata"></div>';
        mesaj.firstChild.textContent = t;
      }
      function okYaz(t) {
        mesaj.innerHTML = '<div class="ok"></div>';
        mesaj.firstChild.textContent = t;
      }

      if (!window.supabase || !supabase.createClient) {
        aciklama.textContent = "Sayfa yüklenemedi";
        hataYaz("Supabase kütüphanesi açılmadı. İnternet bağlantınızı kontrol edip sayfayı yenileyin.");
        return;
      }

      var sb = supabase.createClient(SUPABASE_URL, ANON);

      function params() {
        var h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
        var q = new URLSearchParams(location.search || "");
        function get(k) { return h.get(k) || q.get(k); }
        return {
          access_token: get("access_token"),
          refresh_token: get("refresh_token"),
          type: get("type"),
          code: get("code"),
          error: get("error_description") || get("error")
        };
      }

      function sifreFormunuAc() {
        aciklama.textContent = "Şifre sıfırlama";
        form.classList.remove("gizli");
      }

      function dogrulamaGoster() {
        aciklama.textContent = "Hesap doğrulama";
        onay.classList.remove("gizli");
        try { history.replaceState(null, "", location.pathname); } catch (e) {}
      }

      async function baslat() {
        try {
          var p = params();
          if (p.error) {
            aciklama.textContent = "Bağlantı geçersiz veya süresi dolmuş.";
            hataYaz(p.error);
            return;
          }

          // PKCE: ?code=...
          if (p.code && !p.access_token) {
            var ex = await sb.auth.exchangeCodeForSession(p.code);
            if (ex.error) {
              aciklama.textContent = "Oturum açılamadı.";
              hataYaz(ex.error.message);
              return;
            }
            // recovery genelde hash type ile gelir; code akışında formu aç
            sifreFormunuAc();
            return;
          }

          if (!p.access_token || !p.refresh_token) {
            aciklama.textContent = "Bu sayfa e-posta doğrulama ve şifre sıfırlama içindir.";
            mesaj.innerHTML = "<p>Masaüstü: <b>dose-mobil.exe</b> · Mobil: <b>DOSE_Mobil</b> APK ile giriş yapın.</p>" +
              "<p>Şifre alanını görmüyorsanız e-postadaki <b>yeni</b> sıfırlama bağlantısını kullanın; linki kopyalayıp tarayıcı adres çubuğuna yapıştırın.</p>";
            return;
          }

          var ss = await sb.auth.setSession({
            access_token: p.access_token,
            refresh_token: p.refresh_token
          });
          if (ss.error) {
            aciklama.textContent = "Oturum açılamadı.";
            hataYaz(ss.error.message + " — Yeni bir «Şifremi unuttum» e-postası isteyin.");
            return;
          }

          // recovery veya type yoksa (bazı istemciler type'ı düşürür) şifre formu
          if (p.type === "recovery" || !p.type || p.type === "invite") {
            sifreFormunuAc();
            return;
          }
          dogrulamaGoster();
        } catch (err) {
          aciklama.textContent = "Hata";
          hataYaz(String(err && err.message ? err.message : err));
        }
      }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        var s1 = document.getElementById("s1").value;
        var s2 = document.getElementById("s2").value;
        var dugme = document.getElementById("kaydet");
        mesaj.innerHTML = "";
        if (s1.length < 8) { hataYaz("Şifre en az 8 karakter olmalı."); return; }
        if (s1 !== s2) { hataYaz("Şifreler eşleşmiyor."); return; }
        dugme.disabled = true;
        try {
          var up = await sb.auth.updateUser({ password: s1 });
          if (up.error) {
            hataYaz(up.error.message);
            dugme.disabled = false;
            return;
          }
          form.classList.add("gizli");
          aciklama.textContent = "Şifre güncellendi";
          okYaz("Tamam. Masaüstü veya mobil uygulamayı açıp yeni şifrenizle giriş yapın.");
          try { history.replaceState(null, "", location.pathname); } catch (e2) {}
          await sb.auth.signOut();
        } catch (err) {
          hataYaz(String(err && err.message ? err.message : err));
          dugme.disabled = false;
        }
      });

      baslat();
    })();
  </script>
</body>
</html>
